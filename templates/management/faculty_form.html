{% extends 'management/base.html' %}

{% block mgmt_content %}
<div class="max-w-2xl mx-auto bg-white rounded-xl shadow-sm border border-gray-100 p-6 mt-8">
    <div class="flex items-center gap-3 mb-6">
        <a href="{% url 'institution:faculty_list' %}" class="p-2 bg-gray-50 rounded-full hover:bg-gray-100 transition">
            <i data-lucide="arrow-left" class="w-5 h-5 text-gray-600"></i>
        </a>
        <h2 class="text-xl font-bold text-gray-800">
            {% if faculty %}Edit Faculty{% else %}Create New Faculty{% endif %}
        </h2>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="mb-4 p-4 rounded-lg {% if message.tags == 'error' %}bg-red-50 text-red-700 border border-red-100{% else %}bg-green-50 text-green-700 border border-green-100{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <!-- CRITICAL: Inputs MUST have name="name" and name="code" -->
    <form method="POST" class="space-y-5">
        {% csrf_token %}
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Faculty Name</label>
            <input type="text" name="name" required 
                   value="{{ faculty.name|default:'' }}"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition"
                   placeholder="e.g., Faculty of Arts">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Faculty Code</label>
            <input type="text" name="code" required maxlength="20"
                   value="{{ faculty.code|default:'' }}"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition uppercase font-mono"
                   placeholder="e.g., FOA">
        </div>

        <div class="pt-4 flex justify-end gap-3">
            <a href="{% url 'institution:faculty_list' %}" class="px-4 py-2 text-gray-600 hover:text-gray-800 font-medium">Cancel</a>
            <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 transition shadow-sm">
                {% if faculty %}Update Faculty{% else %}Create Faculty{% endif %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
