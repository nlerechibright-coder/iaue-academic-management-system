<!-- templates/management/confirm_delete.html -->
{% extends 'management/base.html' %}

{% block mgmt_content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow-sm border border-red-100 p-6 text-center mt-8">
    <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <i data-lucide="alert-triangle" class="w-8 h-8 text-red-600"></i>
    </div>
    <h3 class="text-lg font-bold text-gray-800 mb-2">Are you sure?</h3>
    <p class="text-gray-600 mb-6">You are about to delete <strong>{{ type }}: "{{ object }}"</strong>. This action cannot be undone.</p>
    
    <form method="POST" class="flex justify-center gap-3">
        {% csrf_token %}
        <!-- USE THE PASSED VARIABLE FOR THE CANCEL LINK -->
        <a href="{% url cancel_url_name %}" class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 transition">Cancel</a>
        <button type="submit" class="px-4 py-2 bg-red-600 text-white rounded-lg text-sm font-medium hover:bg-red-700 transition shadow-sm">Yes, Delete</button>
    </form>
</div>
{% endblock %}
