{% extends 'management/base.html' %}
{% block title %}Confirm Delete{% endblock %}
{% block page_title %}Confirm Deletion{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow-sm border border-red-100 p-6 text-center">
    <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <i data-lucide="alert-triangle" class="w-8 h-8 text-red-600"></i>
    </div>
    <h3 class="text-lg font-bold text-gray-800 mb-2">Are you sure?</h3>
    <p class="text-gray-600 mb-6">You are about to delete <strong>{{ object }}</strong>. This action cannot be undone.</p>
    <form method="POST" class="flex justify-center gap-3">
        {% csrf_token %}
        <a href="{% url url_name %}" class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50">Cancel</a>
        <button type="submit" class="px-4 py-2 bg-red-600 text-white rounded-lg text-sm font-medium hover:bg-red-700">Yes, Delete</button>
    </form>
</div>
{% endblock %}
